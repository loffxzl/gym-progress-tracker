version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gym_postgres
    restart: always
    environment:
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: secure_production_password
      POSTGRES_DB: gym_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_user -d gym_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gym_backend
    restart: always
    environment:
      PORT: 5001
      NODE_ENV: production
      DATABASE_URL: "postgresql://gym_user:secure_production_password@postgres:5432/gym_tracker?schema=public"
      JWT_SECRET: "replace-with-a-random-64-character-production-secret-key"
      CORS_ORIGIN: "http://localhost"
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gym_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
